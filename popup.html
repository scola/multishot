<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1 data-i18n="popupTitle">Scroll Screenshot</h1>

  <button id="toggle" class="primary" data-i18n="btnStart">Start Capture</button>
  <p id="status" class="status"></p>

  <fieldset>
    <label><span data-i18n="lblDelay">Delay after scroll (ms)</span>
      <input id="delay" type="number" min="200" step="100">
    </label>
    <label><span data-i18n="lblMaxShots">Max shots (0 = unlimited)</span>
      <input id="maxShots" type="number" min="0" step="1">
    </label>
    <label><span data-i18n="lblOverlap">Overlap (px)</span>
      <input id="overlap" type="number" min="0" step="10">
    </label>
    <label><span data-i18n="lblFormat">Format</span>
      <select id="format">
        <option value="png">PNG</option>
        <option value="jpeg">JPEG</option>
      </select>
    </label>
    <label class="wide"><span data-i18n="lblSaveMode">Save Method</span>
      <select id="saveMode">
        <option value="zip" data-i18n="optZip">Pack into a single ZIP file</option>
        <option value="files" data-i18n="optFiles">Save as individual images</option>
      </select>
    </label>
    <label class="wide"><span data-i18n="lblSubfolder">Subfolder (under ~/Downloads/)</span>
      <input id="subfolder" type="text" data-i18n-placeholder="placeholderSubfolder" placeholder="Leave empty to save directly to Downloads">
    </label>
    <label class="check">
      <input id="scrollToTop" type="checkbox"> <span data-i18n="lblScrollToTop">Scroll to top before starting</span>
    </label>
  </fieldset>

  <div class="notice">
    <span data-i18n="noticeText">Screenshots are buffered in memory and saved all at once. If a Save As dialog appears, please disable "Ask where to save each file before downloading" in Chrome settings.</span>
    <button id="openSettings" class="link" data-i18n="btnOpenSettings">Open Download Settings</button>
  </div>

  <p class="hint" data-i18n="hintShortcut">Shortcut: Alt+Shift+S to start / stop</p>
  <script src="popup.js"></script>
</body>
</html>
